name: Test manifests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        shell:
          - powershell
          - pwsh
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out bucket
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
          path: bucket_repo

      - name: Check out Scoop
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core

      - name: Install and cache test dependencies
        uses: potatoqualitee/psmodulecache@9e4b63833c22c1768d648e115a9c849afdda22a5
        with:
          modules-to-cache: BuildHelpers, Pester
          shell: ${{ matrix.shell }}

      - name: Run Scoop bucket tests
        run: |
          $env:SCOOP_HOME = Convert-Path '.\scoop_core'
          .\bucket_repo\bin\test.ps1
